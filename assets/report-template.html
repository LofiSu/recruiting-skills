<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PAPER_TITLE}} · 作者与公开联系方式</title>
  <style>
    :root {
      color-scheme: light;
      --page: #ffffff;
      --ink: #171717;
      --muted: #626262;
      --line: #dededb;
      --soft: #f5f5f2;
      --accent: #245c4a;
      --accent-soft: #e9f2ee;
      --possible: #8a5a16;
      --possible-soft: #f7efe1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    .page {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 64px 0 80px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 980px;
      margin: 0;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }

    .paper-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin: 42px 0;
      border: 1px solid var(--line);
      background: var(--line);
    }

    .summary > div {
      min-height: 104px;
      padding: 20px 22px;
      background: var(--page);
    }

    .summary strong {
      display: block;
      margin-bottom: 5px;
      font-size: 24px;
      line-height: 1.2;
    }

    .summary span {
      color: var(--muted);
      font-size: 13px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin: 0 0 14px;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.02em;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .table-wrap {
      border-top: 2px solid var(--ink);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: 17px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    thead th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    tbody th {
      font-size: 15px;
      font-weight: 720;
    }

    td {
      font-size: 14px;
    }

    th:nth-child(1) { width: 18%; }
    th:nth-child(2) { width: 18%; }
    th:nth-child(3) { width: 25%; }
    th:nth-child(4) { width: 14%; }
    th:nth-child(5) { width: 25%; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 12px;
    }

    .state {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }

    .state-verified {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .state-possible {
      background: var(--possible-soft);
      color: var(--possible);
    }

    .state-unknown,
    .state-not-searched {
      background: var(--soft);
      color: var(--muted);
    }

    .muted { color: var(--muted); }

    footer {
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 28px, 680px);
        padding: 36px 0 56px;
      }

      .summary {
        grid-template-columns: 1fr;
        margin: 30px 0;
      }

      .summary > div { min-height: auto; }
      .section-heading { display: block; }
      .section-heading p { margin-top: 6px; }
      .table-wrap { overflow: visible; }
      table, thead, tbody, tr, th, td { display: block; }
      thead {
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        clip: rect(0 0 0 0);
        overflow: hidden;
      }

      tbody tr {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }

      tbody th,
      tbody td {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        gap: 12px;
        width: auto;
        padding: 5px 0;
        border: 0;
      }

      tbody th::before,
      tbody td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
    }

    @media print {
      body { color: #000; background: #fff; }
      .page { width: 100%; padding: 0; }
      a { color: #000; text-decoration: none; }
      a[href^="http"]::after {
        content: " (" attr(href) ")";
        font-size: 9pt;
        font-weight: 400;
      }
      tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">Researcher recruiting brief</p>
      <h1>{{PAPER_TITLE}}</h1>
      <div class="paper-meta">
        <a href="{{ARXIV_URL}}">arXiv 原文</a>
        {{PAPER_META}}
      </div>
    </header>

    <section class="summary" aria-label="报告摘要">
      {{SUMMARY}}
    </section>

    <section aria-labelledby="authors-heading">
      <div class="section-heading">
        <h2 id="authors-heading">作者与公开联系路径</h2>
        <p>按 arXiv 作者顺序 · 仅展示有公开证据支持的信息</p>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">作者</th>
              <th scope="col">机构</th>
              <th scope="col">公开联系路径</th>
              <th scope="col">状态</th>
              <th scope="col">证据</th>
            </tr>
          </thead>
          <tbody>
            {{AUTHOR_ROWS}}
            <!--
            <tr>
              <th scope="row" data-label="作者">EXACT_AUTHOR_NAME</th>
              <td data-label="机构">INSTITUTION_OR_暂未找到</td>
              <td data-label="公开联系路径">
                SAFE_LINKS_OR_暂未找到
              </td>
              <td data-label="状态">
                <span class="state state-verified">已核验</span>
              </td>
              <td data-label="证据">EVIDENCE_LINKS</td>
            </tr>
            -->
          </tbody>
        </table>
      </div>
    </section>

    <footer>
      仅收录公开职业信息。未猜测邮箱，未登录或直接抓取受限平台；
      “可能匹配”和“暂未找到”均需人工复核。
    </footer>
  </main>
</body>
</html>
